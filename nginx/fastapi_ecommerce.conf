upstream fastapi_ecommerce {
    server web:8000;
}

server {
    listen 80;

    server_name pystore.ru;
    #Слушаем web:8000(контейнер FastAPI) на следующих адресах:
    location /api/ {
        proxy_pass http://fastapi_ecommerce;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /docs {
        proxy_pass http://fastapi_ecommerce;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /media/ {
        alias /var/www/media/;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}